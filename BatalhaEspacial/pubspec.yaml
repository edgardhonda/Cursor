name: batalha_espacial
description: "Batalha Espacial — nave em perspectiva 3D, inimigos com força numérica e escolha rápida."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#020818"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/start.wav
    - assets/sounds/alert.wav
    - assets/sounds/laser.wav
    - assets/sounds/destroy.wav
    - assets/sounds/wrong.wav
    - assets/sounds/blast.wav
