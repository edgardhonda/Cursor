name: obstaculos
description: "Obstáculos — atravesse a floresta resolvendo desafios com os recursos certos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/walk.wav
    - assets/sounds/fail.wav
    - assets/sounds/cheer.wav
    - assets/sounds/destroy.wav
    - assets/sounds/climb.wav
    - assets/sounds/splash.wav
    - assets/sounds/whoosh.wav
    - assets/sounds/tick.wav
