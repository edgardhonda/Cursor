name: sapos
description: "Sapos — um sapo come moscas na sopa, afasta sapos maus e recebe ajuda dos bons."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/tongue.wav
    - assets/sounds/gulp.wav
    - assets/sounds/boom.wav
    - assets/sounds/ribbit.wav
    - assets/sounds/buzz.wav
    - assets/sounds/cheer.wav
