name: desenhar_com_dedos
description: Desenho simples com os dedos — Android e tablet.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true
