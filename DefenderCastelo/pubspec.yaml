name: defender_castelo
description: Jogo Defender Castelo — soldados stick-man atacam o castelo do rei.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/spawn.wav
    - assets/sounds/shoot.wav
    - assets/sounds/hit.wav
    - assets/sounds/blast.wav
    - assets/sounds/swipe.wav
